plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
    id 'com.gradleup.shadow' version "9.3.0"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

configurations {
    shade
}

configurations.implementation.extendsFrom(configurations.shade)

shadowJar {
    configurations = [project.configurations.shade]
    relocate('gg.moonflower.molangcompiler', 'libs.gg.moonflower.molangcompiler')
    relocate('gg.moonflower.pinwheel', 'libs.gg.moonflower.pinwheel')
    from(".") {
        include 'LICENSE*'
    }
    archiveClassifier = ''
}

repositories {
    flatDir(dirs: "libs")
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

configurations {
    shadeSources
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    //todo do something to remove this as dependency completely
    Set<String> apiModules = [
            "fabric-api-base",
            "fabric-resource-loader-v1",
            "fabric-object-builder-api-v1",
            "fabric-rendering-v1"
    ]

    apiModules.forEach {
        implementation(fabricApi.module(it, project.fabric_version))
    }

    //implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    shade("gg.moonflower:pinwheel:${project.pinwheel_version}") // based upon commit 77565323f7
    shade("gg.moonflower:molang-compiler:${project.molang_compiler_version}") // based upon ver 3.1.1.19

    shadeSources("gg.moonflower:pinwheel:${project.pinwheel_version}-sources")
    shadeSources("gg.moonflower:molang-compiler:${project.molang_compiler_version}-sources")
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

loom {
    accessWidenerPath = file("src/main/resources/biscuit_roll.accesswidener")
    runs {
        testClient {
            inherit client

            configName = "Test Minecraft Client"
            source = sourceSets.test
        }
    }
}

tasks.withType(AbstractTestTask).configureEach {
    failOnNoDiscoveredTests = false
}

// don't judge, I vibecoded 90% of it
// it works and it's all that matters
tasks.register('fatSourcesJar', Jar) {
    archiveClassifier.set('sources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        def allSourceDirs = []
        allSourceDirs += configurations.shadeSources.collect { dep ->
            if (dep.isDirectory()) return dep

            def tempDir = layout.buildDirectory.dir("tmp/sources/dep-${dep.name}").get().asFile
            copy {
                from zipTree(dep)
                into tempDir
            }
            tempDir
        }
        def projectSourcesTemp = layout.buildDirectory.dir("tmp/sources/project-main").get().asFile
        copy {
            from sourceSets.main.allSource
            into projectSourcesTemp
        }
        allSourceDirs += projectSourcesTemp

        def oldPackage = 'gg.moonflower'
        def newPackage = 'libs.gg.moonflower'
        def oldPath = oldPackage.replace('.', '/')
        def newPath = newPackage.replace('.', '/')

        allSourceDirs.each { dir ->
            if (!dir.exists()) return

            fileTree(dir).matching {
                include '**/*.java'
            }.each { file ->
                def relativePath = dir.toPath().relativize(file.toPath()).toString()

                def currentFile = file
                def text = file.text

                if (relativePath.startsWith(oldPath)) {
                    def newRelative = relativePath.replaceFirst(oldPath, newPath)
                    def newFile = new File(dir, newRelative)

                    newFile.parentFile.mkdirs()
                    file.renameTo(newFile)

                    currentFile = newFile
                    text = newFile.text
                }

                text = text.replaceAll(~/(?m)^package\s+${oldPackage.replace('.', '\\.')}(\.[^\s;]+)?\s*;?/, 'package ' + newPackage + '$1;')
                text = text.replaceAll(~/(?m)^import\s+(static\s+)?${oldPackage.replace('.', '\\.')}(\.[^\s;]+)?\s*;?/, 'import $1' + newPackage + '$2;')
                text = text.replaceAll(~/(?m)^import\s+(static\s+)?${oldPackage.replace('.', '\\.')}\b/, 'import $1' + newPackage)

                currentFile.text = text
            }
        }
        allSourceDirs
    }

    from(".") {
        include 'LICENSE*'
    }
}

sourcesJar.finalizedBy fatSourcesJar

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = rootProject.properties.get("maven_group")
            artifactId = rootProject.properties.get("archives_base_name")
            version = rootProject.properties.get("mod_version")
            artifact(fatSourcesJar) {
                classifier = 'sources'
            }
            artifact(shadowJar) {
                classifier = ''
            }
        }
    }

    repositories {
        maven {
            allowInsecureProtocol = true //todo fix this once done setting up maven
            name = 'nordact-repo'
            url = uri('http://192.168.2.57:8080/releases/')
            credentials {
                username = providers.environmentVariable("MAVEN_USERNAME").get()
                password = providers.environmentVariable("MAVEN_TOKEN").get()
            }
        }
    }
}
